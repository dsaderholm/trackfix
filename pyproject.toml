[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackfix"
version = "0.1.0"
description = "Repair playback glitches in a show's backing-track recording, using the other nights"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.scripts]
trackfix = "trackfix.cli:main"

[tool.setuptools.packages.find]
include = ["trackfix*"]

[tool.setuptools.package-data]
trackfix = ["dip_template.npy"]
